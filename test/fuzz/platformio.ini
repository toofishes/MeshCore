[env:native-fuzz]
platform = native
extra_scripts = post:./test/fuzz/clang-fuzz-coverage.py
lib_compat_mode = off
lib_deps =
  rweather/Crypto @ ^0.4.0
  skaygin/ArduinoNative @ ^0.1.4
build_flags = -std=c++17
  -g3
  -fno-omit-frame-pointer
  -fsanitize=address
  -fsanitize=bounds
  -fsanitize=signed-integer-overflow
  -fsanitize=fuzzer
  -fprofile-instr-generate
  -fcoverage-mapping
  -DUNIT_TEST
build_src_filter =
  +<*.cpp>
  +<helpers/SimpleMeshTables.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
  +<../test/fuzz>
